[resources]
	#Resource used by Goety glyph triggers. Native Goety and other Ars glyphs retain their own rules.
	#Allowed Values: SOUL_ENERGY, ARS_MANA
	source = "SOUL_ENERGY"
	#Additional trigger cost per Burning augment, before native soul discounts. Uses the selected resource.
	# Default: 5
	# Range: 0 ~ 1000000
	burningCostPerUnit = 5
	#Additional trigger cost per Extension augment, before native soul discounts.
	# Default: 5
	# Range: 0 ~ 1000000
	extensionCostPerUnit = 5
	#Additional trigger cost for Life Absorb, before native soul discounts.
	# Default: 5
	# Range: 0 ~ 1000000
	lifeAbsorbCost = 5
	#Additional trigger cost per Soul Eater augment, before native soul discounts.
	# Default: 5
	# Range: 0 ~ 1000000
	soulEaterCostPerUnit = 5

[chanting]
	#Native Goety preparation on active Ars recipes containing Goety glyphs. Mixed casts prepare once via Conflux.
	#Includes native casting-speed/gear adjustments. Charging focuses contribute castUp, not item-use lifetime.
	#Does not reproduce hold-to-charge, magazine cadence or charge-dependent strength.
	#False restores immediate casting. Hits, Orbit/Echo and passive triggers never re-chant.
	enabled = true
	#Apply native-style player movement limits during Conflux preparations containing Goety glyphs.
	#Uses Goety fullStopCast: stop movement/jumping when enabled, otherwise 20% walking speed.
	#Does not affect pure Ars recipes, passengers or native Goety casting.
	movementRestrictions = true

[cooldowns]
	#Native focus cooldowns shared with Goety wands and other Ars recipes. Includes native cooldown reduction.
	#Check before preparation and again on release. An acknowledged release starts each distinct focus cooldown once.
	#Creative bypasses existing cooldowns and adds none unless creativeCooldown is enabled; resources remain free.
	#Existing projectiles and repeated triggers continue; custom charge/stop-based cooldown lifecycles are not reproduced.
	#Automatic devices, passive effects and third-party direct resolvers are unaffected unless explicitly integrated.
	enabled = true
	#Apply bridge focus cooldowns in creative mode. False bypasses both checks and writes.
	#True restores the original Goety creative cooldown behavior.
	creativeCooldown = false

[channels]
	#Finite base lifetime in ticks for supported held-channel spells whose native duration is infinite (zero).
	#Used by Corrupted Beam, Water Jet, Warding, Flying, Telekinesis and Burrowing when their native duration is zero. Positive native durations retain their own value. Ars duration augments scale this base.
	#This does not change native Goety wand casting.
	# Default: 200
	# Range: 1 ~ 72000
	unboundedDurationTicks = 200

[bossAbilities]
	#Cap the additional native percentage health loss of bridge-created Death Arrows. Native arrows and equipment qualifications are unchanged.
	capDeathArrowPercentage = true
	#Maximum additional health loss per qualified Death Arrow hit, before ordinary healing events.
	# Default: 20.0
	# Range: 0.0 ~ 1000000.0
	deathArrowPercentageCap = 20.0

