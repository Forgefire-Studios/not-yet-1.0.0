#Emulator volume in steps of 10% (0-10), on top of the Jukebox/Note Blocks slider.
# Default: 10
# Range: 0 ~ 10
volume = 10
#Volume of other players' consoles and handhelds in steps of 10% (0-10).
#Changed in game with the Other Players' Volume keys.
# Default: 10
# Range: 0 ~ 10
otherPlayersVolume = 10
#Mute your own game.
muted = false
#Mute other players' games, without touching your own.
otherPlayersMuted = false
#Adjust colors to look like a real GBA/GBC screen (less saturated, slightly darker).
colorCorrection = false
#Blend each frame with the previous one, like the slow LCD of the original hardware.
lcdGhosting = false
#Open games in the in-world view (watch the console or handheld) instead of full screen.
#Toggled in game with the View key.
inWorldView = false
#How fast the game runs while the Fast-Forward key is held (2-4x).
# Default: 2
# Range: 2 ~ 4
fastForwardSpeed = 2
#Use a connected gamepad (Xbox, PlayStation, ...) in the emulator screen.
gamepadEnabled = true
#How far (in %) the left stick must move before it counts as a D-pad press.
# Default: 35
# Range: 10 ~ 90
gamepadDeadzone = 35
#Use Nintendo button positions: the right face button is A and the bottom one is B.
#When false, the pad's A/B labels match the game's A/B.
gamepadPositionalAB = false
#Let players near your console see your game (if the server allows screen sharing).
shareMyScreen = true
#Show the games other players share on their consoles and TVs.
showOtherScreens = true
#Continue games where you left off: when a game stops (you close Minecraft, walk away,
#put the handheld away, power off...) its exact state is saved, and restored the next time
#you play that cartridge. Separate from your own save-state slot.
resumeGames = true
